<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Six vision models compared on 31 labelled screens: how many marks landed on the right region and the median seconds per turn; and how a second model covers a slow first one">
  <defs>
    <style>
      .bg { fill: #0e1320; }
      .panel { fill: #121a2b; stroke: #2a3552; stroke-width: 1.5; }
      .title { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef1f8; }
      .sub { font: 400 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #97a0b8; }
      .name { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef1f8; }
      .num { font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef1f8; }
      .small { font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #97a0b8; }
      .ok { fill: #3ddc97; }
      .bad { fill: #ff9a4a; }
      .none { fill: #4a5470; }
      .track { fill: #1b2540; }
      .tag { font: 700 11.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0e1320; }
      .tagbg { fill: #ff6b4a; }
      .tagbg2 { fill: #5b8cff; }
      .axis { stroke: #34416a; stroke-width: 2; }
      .mark { stroke: #ff6b4a; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .lbl { font: 700 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1e6; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="600" rx="18"/>

  <!-- left: six models -->
  <rect class="panel" x="20" y="20" width="620" height="560" rx="16"/>
  <text class="title" x="44" y="58">Six vision models, the same 31 screens</text>
  <text class="sub" x="44" y="80">Did the mark land on the right region? Bars are out of 31 cases.</text>
  <text class="small" x="498" y="118" text-anchor="middle">correct of 31</text>
  <text class="small" x="590" y="118" text-anchor="middle">median s</text>

  <!-- rows: y = 130 + i*70 ; bar x=230 width 31*8.5=263.5 -->
  <g transform="translate(0 130)">
    <!-- DeepSeek -->
    <text class="name" x="44" y="26">DeepSeek V4.1 Flash</text><rect class="tagbg" x="44" y="34" width="62" height="16" rx="8"/><text class="tag" x="75" y="46" text-anchor="middle">DEFAULT</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/><rect class="ok" x="230" y="12" width="263.5" height="30" rx="8"/><text class="num" x="494" y="33" text-anchor="start" style="fill:#08241a" dx="-34">31</text>
    <text class="num" x="590" y="33" text-anchor="middle">2.6</text>
  </g>
  <g transform="translate(0 200)">
    <text class="name" x="44" y="26">Qwen3.8-27B</text><rect class="tagbg2" x="44" y="34" width="104" height="16" rx="8"/><text class="tag" x="96" y="46" text-anchor="middle">SECOND MODEL</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/><rect class="ok" x="230" y="12" width="263.5" height="30" rx="8"/><text class="num" x="494" y="33" style="fill:#08241a" dx="-34">31</text>
    <text class="num" x="590" y="33" text-anchor="middle">2.4</text>
  </g>
  <g transform="translate(0 270)">
    <text class="name" x="44" y="32">GLM-5.3-Flash</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/><rect class="ok" x="230" y="12" width="263.5" height="30" rx="8"/><text class="num" x="494" y="33" style="fill:#08241a" dx="-34">31</text>
    <text class="num" x="590" y="33" text-anchor="middle">5.9</text>
  </g>
  <g transform="translate(0 340)">
    <text class="name" x="44" y="32">Kimi-K2.6</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/>
    <rect class="ok" x="230" y="12" width="229.5" height="30" rx="8"/>
    <rect class="none" x="459.5" y="12" width="34" height="30" rx="0"/>
    <rect class="none" x="486" y="12" width="8" height="30" rx="4"/>
    <text class="num" x="440" y="33" style="fill:#08241a">27</text>
    <text class="small" x="230" y="58">4 gave no usable answer</text>
    <text class="num" x="590" y="33" text-anchor="middle">6.0</text>
  </g>
  <g transform="translate(0 410)">
    <text class="name" x="44" y="32">Gemma-3-27B</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/>
    <rect class="ok" x="230" y="12" width="221" height="30" rx="8"/>
    <rect class="bad" x="451" y="12" width="25.5" height="30"/>
    <rect class="none" x="476.5" y="12" width="17.5" height="30" rx="4"/>
    <text class="num" x="430" y="33" style="fill:#08241a">26</text>
    <text class="num" x="590" y="33" text-anchor="middle">3.5</text>
  </g>
  <g transform="translate(0 480)">
    <text class="name" x="44" y="32">MiniCPM-V-4.5</text>
    <rect class="track" x="230" y="12" width="264" height="30" rx="8"/>
    <rect class="ok" x="230" y="12" width="212.5" height="30" rx="8"/>
    <rect class="bad" x="442.5" y="12" width="42.5" height="30"/>
    <rect class="none" x="485" y="12" width="9" height="30" rx="4"/>
    <text class="num" x="420" y="33" style="fill:#08241a">25</text>
    <text class="num" x="590" y="33" text-anchor="middle">2.3</text>
  </g>

  <!-- legend -->
  <rect class="ok" x="44" y="556" width="14" height="14" rx="3"/><text class="small" x="64" y="568">right region</text>
  <rect class="bad" x="164" y="556" width="14" height="14" rx="3"/><text class="small" x="184" y="568">wrong region</text>
  <rect class="none" x="288" y="556" width="14" height="14" rx="3"/><text class="small" x="308" y="568">no usable answer</text>
  <text class="small" x="430" y="568">First run of all six models.</text>

  <!-- right: hedging -->
  <rect class="panel" x="660" y="20" width="320" height="560" rx="16"/>
  <text class="title" x="684" y="58">Hedged requests</text>
  <text class="sub" x="684" y="80">The same model took 2 s on one</text>
  <text class="sub" x="684" y="99">call and 47 s on another.</text>

  <text class="lbl" x="684" y="160">DeepSeek V4.1 Flash</text>
  <rect class="track" x="684" y="172" width="272" height="26" rx="8"/>
  <rect x="684" y="172" width="250" height="26" rx="8" fill="#5b8cff" opacity="0.85"/>
  <text class="small" x="700" y="190" style="fill:#0e1320;font-weight:700">slow today...</text>

  <text class="lbl" x="684" y="268">Qwen3.8-27B</text>
  <rect class="track" x="684" y="280" width="272" height="26" rx="8"/>
  <rect class="ok" x="793" y="280" width="104" height="26" rx="8"/>
  <text class="small" x="805" y="298" style="fill:#08241a;font-weight:700">answers first</text>

  <line class="axis" x1="684" y1="352" x2="956" y2="352"/>
  <text class="small" x="684" y="372">0 s</text><text class="small" x="956" y="372" text-anchor="end">10 s</text>
  <line class="mark" x1="793" y1="206" x2="793" y2="352"/>
  <text class="lbl" x="799" y="228" style="fill:#ff9a4a">4 s</text>
  <text class="sub" x="684" y="410">No step after 4 seconds? The same</text>
  <text class="sub" x="684" y="430">request goes to the second model.</text>
  <text class="sub" x="684" y="456" style="fill:#eef1f8;font-weight:600">The first answer wins.</text>
  <text class="small" x="684" y="500">Most of the delay disappears without</text>
  <text class="small" x="684" y="518">paying for two answers every time.</text>
  <text class="small" x="684" y="556">Schematic: the 4 s trigger is the setting,</text>
  <text class="small" x="684" y="572">the bars show the idea.</text>
</svg>
