<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Sherpa sees the page, understands the goal, points at the next step, and follows the page change">
  <defs>
    <style>
      .bg { fill: #0e1320; }
      .card { fill: #161d2e; stroke: #2a3552; stroke-width: 1.5; }
      .title { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef1f8; }
      .sub { font: 400 14.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #97a0b8; }
      .num { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ff6b4a; letter-spacing: 1.5px; }
      .screen { fill: #0e1320; stroke: #34416a; stroke-width: 1.5; }
      .line { fill: #2a3552; }
      .region { fill: none; stroke: #5b8cff; stroke-width: 1.6; stroke-dasharray: 4 3; }
      .btn { fill: #26304d; stroke: #34416a; stroke-width: 1.2; }
      .hot { fill: none; stroke: #ff6b4a; stroke-width: 3; }
      .arrow { fill: none; stroke: #ff6b4a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #3b4a78; stroke-width: 2; stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
      .head { fill: #3b4a78; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .scan { animation: scan 3.2s ease-in-out infinite; }
      .page2 { animation: swap 4.8s steps(1, end) infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(56px); opacity: 0; } }
      @keyframes swap { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect class="bg" width="1000" height="330" rx="18"/>

  <!-- 1 See -->
  <g transform="translate(30 30)">
    <rect class="card" width="210" height="270" rx="14"/>
    <text class="num" x="20" y="34">1</text>
    <text class="title" x="20" y="64">Sees</text>
    <text class="sub" x="20" y="88">the page you are on,</text>
    <text class="sub" x="20" y="108">right now</text>
    <g transform="translate(20 130)">
      <rect class="screen" width="170" height="116" rx="8"/>
      <rect class="line" x="12" y="14" width="64" height="7" rx="3"/>
      <rect class="line" x="12" y="30" width="110" height="5" rx="2.5"/>
      <rect class="line" x="12" y="42" width="96" height="5" rx="2.5"/>
      <rect class="btn" x="12" y="62" width="48" height="20" rx="5"/>
      <rect class="btn" x="68" y="62" width="48" height="20" rx="5"/>
      <rect class="btn" x="124" y="62" width="34" height="20" rx="5"/>
      <rect class="region" x="8" y="9" width="72" height="17" rx="3"/>
      <rect class="region" x="8" y="57" width="56" height="30" rx="4"/>
      <rect class="region" x="64" y="57" width="56" height="30" rx="4"/>
      <rect class="region" x="120" y="57" width="42" height="30" rx="4"/>
      <rect class="scan" x="4" y="4" width="162" height="3" rx="1.5" fill="#5b8cff" opacity="0.8"/>
    </g>
  </g>

  <!-- 2 Understand -->
  <g transform="translate(270 30)">
    <rect class="card" width="210" height="270" rx="14"/>
    <text class="num" x="20" y="34">2</text>
    <text class="title" x="20" y="64">Understands</text>
    <text class="sub" x="20" y="88">what you are trying</text>
    <text class="sub" x="20" y="108">to do</text>
    <g transform="translate(20 134)">
      <rect x="0" y="0" width="170" height="30" rx="15" fill="#26304d"/>
      <text x="85" y="20" text-anchor="middle" class="sub" style="fill:#dfe4f2">"Create an IAM user"</text>
      <path d="M85 34 L85 52" stroke="#3b4a78" stroke-width="2" stroke-linecap="round"/>
      <path d="M79 47 L85 54 L91 47" fill="none" stroke="#3b4a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="60" width="170" height="46" rx="10" fill="#1e2740" stroke="#34416a" stroke-width="1.2"/>
      <text x="14" y="80" class="sub" style="fill:#97a0b8">goal</text>
      <text x="14" y="97" class="sub" style="fill:#eef1f8; font-weight:600">step 1 of 5 · Users</text>
    </g>
  </g>

  <!-- 3 Point -->
  <g transform="translate(510 30)">
    <rect class="card" width="210" height="270" rx="14"/>
    <text class="num" x="20" y="34">3</text>
    <text class="title" x="20" y="64">Points</text>
    <text class="sub" x="20" y="88">at the next step,</text>
    <text class="sub" x="20" y="108">on your screen</text>
    <g transform="translate(20 130)">
      <rect class="screen" width="170" height="116" rx="8"/>
      <rect class="line" x="12" y="14" width="64" height="7" rx="3"/>
      <rect class="line" x="12" y="30" width="110" height="5" rx="2.5"/>
      <rect class="line" x="12" y="42" width="96" height="5" rx="2.5"/>
      <rect class="btn" x="12" y="62" width="48" height="20" rx="5"/>
      <rect class="btn" x="68" y="62" width="48" height="20" rx="5"/>
      <rect class="btn" x="124" y="62" width="34" height="20" rx="5"/>
      <rect class="hot pulse" x="63" y="57" width="58" height="30" rx="6"/>
      <path class="arrow" d="M118 112 C 108 104, 98 98, 92 90"/>
      <path class="arrow" d="M91 99 L92 90 L101 92"/>
    </g>
  </g>

  <!-- 4 Follow -->
  <g transform="translate(750 30)">
    <rect class="card" width="220" height="270" rx="14"/>
    <text class="num" x="20" y="34">4</text>
    <text class="title" x="20" y="64">Follows</text>
    <text class="sub" x="20" y="88">you to the next page,</text>
    <text class="sub" x="20" y="108">until you are done</text>
    <g transform="translate(25 130)">
      <rect class="screen" width="170" height="116" rx="8"/>
      <g>
        <rect class="line" x="12" y="14" width="64" height="7" rx="3"/>
        <rect class="line" x="12" y="30" width="110" height="5" rx="2.5"/>
        <rect class="btn" x="12" y="62" width="48" height="20" rx="5"/>
        <rect class="btn" x="68" y="62" width="48" height="20" rx="5"/>
      </g>
      <g class="page2">
        <rect x="2" y="2" width="166" height="112" rx="7" fill="#0e1320"/>
        <rect class="line" x="12" y="14" width="86" height="7" rx="3"/>
        <rect class="line" x="12" y="32" width="146" height="14" rx="4"/>
        <rect class="line" x="12" y="54" width="146" height="14" rx="4"/>
        <rect class="btn" x="100" y="86" width="58" height="20" rx="5"/>
        <rect class="hot pulse" x="96" y="82" width="66" height="28" rx="6"/>
      </g>
    </g>
  </g>

  <!-- flow between cards -->
  <path class="flow" d="M242 165 L268 165"/>
  <path class="flow" d="M482 165 L508 165"/>
  <path class="flow" d="M722 165 L748 165"/>
  <path class="head" d="M263 159 L271 165 L263 171 Z"/>
  <path class="head" d="M503 159 L511 165 L503 171 Z"/>
  <path class="head" d="M743 159 L751 165 L743 171 Z"/>
</svg>
