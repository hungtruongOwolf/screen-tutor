<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Sherpa architecture: the client on your computer, the backend on AWS Graviton, and the models">
  <defs>
    <style>
      .bg { fill: #0e1320; }
      .zone { fill: #121a2b; stroke: #2a3552; stroke-width: 1.5; }
      .zt { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ff6b4a; letter-spacing: 1.6px; }
      .box { fill: #1b2540; stroke: #34416a; stroke-width: 1.3; }
      .boxa { fill: #1b2540; stroke: #ff6b4a; stroke-width: 1.6; }
      .h { font: 700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef1f8; }
      .p { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #97a0b8; }
      .lbl { font: 600 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1e6; }
      .wire { fill: none; stroke: #4a5b92; stroke-width: 2.2; stroke-linecap: round; }
      .wire2 { fill: none; stroke: #ff6b4a; stroke-width: 2.2; stroke-linecap: round; }
      .ah { fill: #4a5b92; }
      .ah2 { fill: #ff6b4a; }
      .tag { fill: #26304d; }
      .tt { font: 600 11.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #b8c2dd; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="470" rx="18"/>

  <!-- zone: your computer -->
  <rect class="zone" x="24" y="24" width="280" height="422" rx="16"/>
  <text class="zt" x="44" y="52">ON YOUR COMPUTER</text>
  <rect class="box" x="44" y="68" width="240" height="96" rx="12"/>
  <text class="h" x="60" y="94">Capture and watcher</text>
  <text class="p" x="60" y="116">Takes the screen when you ask,</text>
  <text class="p" x="60" y="134">sees the page change, clears</text>
  <text class="p" x="60" y="152">stale marks at once</text>
  <rect class="box" x="44" y="178" width="240" height="96" rx="12"/>
  <text class="h" x="60" y="204">Voice, on the device</text>
  <text class="p" x="60" y="226">whisper.cpp listens, Piper talks.</text>
  <text class="p" x="60" y="244">No audio leaves the computer</text>
  <rect class="boxa" x="44" y="288" width="240" height="96" rx="12"/>
  <text class="h" x="60" y="314">Overlay and chat</text>
  <text class="p" x="60" y="336">Draws arrows, boxes and proofs</text>
  <text class="p" x="60" y="354">on top of any app, keeps the</text>
  <text class="p" x="60" y="372">conversation and the goal</text>
  <text class="p" x="44" y="424" style="font-size:12px">Windows · Electron</text>

  <!-- zone: backend -->
  <rect class="zone" x="344" y="24" width="312" height="422" rx="16"/>
  <text class="zt" x="364" y="52">AWS LAMBDA · GRAVITON</text>
  <rect class="boxa" x="364" y="68" width="272" height="78" rx="12"/>
  <text class="h" x="380" y="94">1 · OpenCV 5 perception</text>
  <text class="p" x="380" y="116">Pixels become numbered regions:</text>
  <text class="p" x="380" y="133">text, lines, controls, figures</text>
  <rect class="box" x="364" y="160" width="272" height="78" rx="12"/>
  <text class="h" x="380" y="186">2 · Planner</text>
  <text class="p" x="380" y="208">The vision model picks regions by</text>
  <text class="p" x="380" y="225">number and writes the steps</text>
  <rect class="box" x="364" y="252" width="272" height="78" rx="12"/>
  <text class="h" x="380" y="278">3 · Narrator</text>
  <text class="p" x="380" y="300">Each step rewritten as natural</text>
  <text class="p" x="380" y="317">speech, guarded against new claims</text>
  <rect class="box" x="364" y="344" width="272" height="78" rx="12"/>
  <text class="h" x="380" y="370">4 · Knowledge</text>
  <text class="p" x="380" y="392">Looks facts up when the screen</text>
  <text class="p" x="380" y="409">does not say them</text>

  <!-- zone: models -->
  <rect class="zone" x="696" y="24" width="280" height="422" rx="16"/>
  <text class="zt" x="716" y="52">MODELS AND TOOLS</text>
  <rect class="box" x="716" y="160" width="240" height="78" rx="12"/>
  <text class="h" x="732" y="186">Nebius Token Factory</text>
  <text class="p" x="732" y="208">DeepSeek V4.1 Flash, with Qwen3.8</text>
  <text class="p" x="732" y="225">as the hedged second model</text>
  <rect class="box" x="716" y="252" width="240" height="78" rx="12"/>
  <text class="h" x="732" y="278">NVIDIA Nemotron</text>
  <text class="p" x="732" y="300">Super, reasoning off, for the</text>
  <text class="p" x="732" y="317">spoken version of each step</text>
  <rect class="box" x="716" y="344" width="240" height="78" rx="12"/>
  <text class="h" x="732" y="370">Tavily</text>
  <text class="p" x="732" y="392">Search with sources, on demand</text>
  <text class="p" x="732" y="409">for the learner to check</text>

  <!-- wires: client to backend -->
  <path class="wire" d="M284 116 L344 116"/>
  <path class="ah" d="M338 110 L346 116 L338 122 Z"/>
  <path class="wire2" d="M344 336 L284 336"/>
  <path class="ah2" d="M290 330 L282 336 L290 342 Z"/>
  <rect class="tag" x="288" y="124" width="52" height="40" rx="8"/>
  <text class="tt" x="314" y="141" text-anchor="middle">screen</text>
  <text class="tt" x="314" y="156" text-anchor="middle">+ goal</text>
  <rect class="tag" x="288" y="344" width="52" height="40" rx="8"/>
  <text class="tt" x="314" y="361" text-anchor="middle">steps,</text>
  <text class="tt" x="314" y="376" text-anchor="middle">streamed</text>

  <!-- wires: backend to models -->
  <path class="wire" d="M636 199 L716 199"/>
  <path class="ah" d="M710 193 L718 199 L710 205 Z"/>
  <path class="wire" d="M636 291 L716 291"/>
  <path class="ah" d="M710 285 L718 291 L710 297 Z"/>
  <path class="wire" d="M636 383 L716 383"/>
  <path class="ah" d="M710 377 L718 383 L710 389 Z"/>

  <!-- vertical flow inside the backend -->
  <path class="wire" d="M500 146 L500 160"/>
  <path class="wire" d="M500 238 L500 252"/>
  <path class="wire" d="M500 330 L500 344"/>
</svg>
