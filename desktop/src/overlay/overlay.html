<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Sherpa overlay</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #canvas { position: fixed; inset: 0; pointer-events: none; }
      #canvas svg { position: absolute; inset: 0; }
      #scan { position: fixed; inset: 0; pointer-events: none; }
      #scan svg { position: absolute; inset: 0; }
      .st-scan {
        fill: rgba(255, 210, 63, 0.10); stroke: rgba(255, 210, 63, 0.95); stroke-width: 2;
        opacity: 0; animation: st-scan 1s ease-out forwards;
      }
      @keyframes st-scan { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="scan"></div>
    <div id="canvas"></div>
    <script src="overlay.js"></script>
  </body>
</html>
