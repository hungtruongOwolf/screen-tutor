<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>screen-tutor voice</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #f1f1f5; }
      .pill { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 12px;
        background: rgba(20, 20, 26, 0.94); border: 1px solid #2c2c38; border-radius: 40px; }
      .orb { position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
        background: #3a3a4c; display: grid; place-items: center; transition: background 0.2s; }
      .orb::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; transition: transform 0.08s, border-color 0.2s; transform: scale(var(--level, 1)); }
      .orb svg { width: 24px; height: 24px; fill: #fff; }
      .text { min-width: 0; flex: 1; }
      .main { font-weight: 600; max-height: 3em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
      .sub { color: #9a9aab; font-size: 12px; max-height: 3em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .starting .orb { background: #3a3a4c; }
      .listening .orb { background: #1f6f43; }
      .listening .orb::before { border-color: rgba(52, 199, 89, 0.55); animation: breathe 2.4s ease-in-out infinite; }
      .hearing .orb { background: #2a9d5c; }
      .hearing .orb::before { border-color: rgba(52, 199, 89, 0.9); }
      .thinking .orb { background: #b8860b; }
      .thinking .orb::before { border-color: rgba(255, 193, 7, 0.7); animation: spin 1s linear infinite; border-top-color: transparent; }
      .speaking .orb { background: #0a6fd8; }
      .speaking .orb::before { border-color: rgba(10, 132, 255, 0.8); animation: breathe 1.1s ease-in-out infinite; }
      .muted .orb { background: #4a4a58; }
      .muted .orb svg { opacity: 0.5; }
      .error .orb { background: #a3261d; }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="pill" class="pill starting">
      <div id="orb" class="orb" title="Click to mute or unmute the microphone (Ctrl+Shift+M)">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </div>
      <div class="text">
        <div id="main" class="main">Starting the microphone</div>
        <div id="sub" class="sub"></div>
      </div>
    </div>
    <script src="voice.js"></script>
  </body>
</html>
