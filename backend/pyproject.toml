[project]
name = "screen-tutor-backend"
version = "0.1.0"
description = "Explain Turn service for screen-tutor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "opencv-python-headless==5.0.0.93",
  "numpy>=2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
